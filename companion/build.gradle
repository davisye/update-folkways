plugins { id 'net.neoforged.moddev' }

// 只有显式 -PclientUiSmoke 才加载验收源码；默认 build/jar 不包含它。
def clientUiSmokeEnabled = providers.gradleProperty('clientUiSmoke').isPresent()
def clientUiSmokeDirectory = rootProject.layout.projectDirectory.dir('work/client-config-smoke')
if (clientUiSmokeEnabled) {
    sourceSets.create('clientSmoke')
    configurations.clientSmokeImplementation.extendsFrom(configurations.implementation)
    configurations.clientSmokeCompileOnly.extendsFrom(configurations.compileOnly)
    configurations.clientSmokeRuntimeOnly.extendsFrom(configurations.runtimeOnly)
    dependencies { clientSmokeImplementation sourceSets.main.output }
    tasks.register('prepareClientUiSmoke') {
        doLast {
            def game = clientUiSmokeDirectory.asFile
            game.mkdirs()
            if (new File(game, 'world').exists() || (new File(game, 'saves').listFiles()?.length ?: 0) > 0) {
                throw new GradleException('Refusing UI smoke in a directory containing worlds')
            }
            new File(game, 'config').mkdirs()
            // 仅此隔离测试实例显式暂停 Folkways，IDE 自身仍需返回独立检查结果。
            def updaterHome = new File(game, '.folkways-updater')
            updaterHome.mkdirs()
            def configFile = new File(updaterHome, 'config.json')
            def smokeConfig = configFile.isFile() ? new groovy.json.JsonSlurper().parseText(configFile.getText('UTF-8')) : [:]
            smokeConfig.localDevelopment = true
            smokeConfig.selfUpdateEnabled = true
            smokeConfig.modules = ['core', 'vanilla']
            configFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(smokeConfig)) + '\n', 'UTF-8')
            new File(game, 'client-ui-smoke-owner.txt').text = 'update-folkways-client-ui-smoke-v1\n'
            new File(game, 'config/fml.toml').text = 'earlyWindowControl=false\n'
            new File(game, 'options.txt').text = 'guiScale:2\nfullscreen:false\nsoundCategory_master:0.0\nonboardAccessibility:false\nlang:zh_cn\n'
        }
    }
}
neoForge {
    version = '21.1.233'
    if (clientUiSmokeEnabled) addModdingDependenciesTo sourceSets.clientSmoke
    mods {
        folkways_updater {
            sourceSet sourceSets.main
            sourceSet project(':updater-core').sourceSets.main
            if (clientUiSmokeEnabled) sourceSet sourceSets.clientSmoke
        }
    }
    runs {
        server { server(); programArgument '--nogui' }
        client {
            client()
            if (clientUiSmokeEnabled) {
                gameDirectory = clientUiSmokeDirectory
                systemProperty 'folkways.updater.clientUiSmoke', 'true'
                systemProperty 'folkways.updater.clientUiSmoke.gameDir', clientUiSmokeDirectory.asFile.absolutePath
                programArgument '--width'
                programArgument '1280'
                programArgument '--height'
                programArgument '800'
                devLogin = false
                disableIdeRun()
                taskBefore tasks.named('prepareClientUiSmoke')
            }
        }
    }
}
dependencies { implementation project(':updater-core') }

def updaterBuildInfo = layout.buildDirectory.dir('generated/updaterBuildInfo')
tasks.register('generateUpdaterBuildInfo') {
    def info = [schema: 1, repository: 'davisye/update-folkways', component: 'companion',
        version: project.version.toString(), commit: providers.gradleProperty('buildId').getOrElse('local'),
        runId: providers.gradleProperty('runId').getOrElse(''),
        runNumber: providers.gradleProperty('runNumber').getOrElse('0').toLong(),
        runAttempt: providers.gradleProperty('runAttempt').getOrElse('0').toInteger(),
        sequence: providers.gradleProperty('sequence').getOrElse('0').toLong(),
        channel: providers.gradleProperty('channel').getOrElse('local'), minecraft: '1.21.1']
    inputs.properties(info)
    outputs.dir(updaterBuildInfo)
    doLast {
        def target = updaterBuildInfo.get().file('META-INF/folkways-updater-build.json').asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(info)) + '\n'
    }
}
sourceSets.main.resources.srcDir(updaterBuildInfo)
tasks.named('processResources') {
    dependsOn 'generateUpdaterBuildInfo'
    inputs.property('modVersion', project.version.toString())
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version.toString()) }
}
tasks.named('jar') {
    archiveBaseName = 'folkways-updater-neoforge-1.21.1'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':updater-core').sourceSets.main.output
    dependsOn ':updater-core:classes', ':updater-core:bootstrapJar'
    from({ project(':updater-core').tasks.named('bootstrapJar').get().archiveFile.get().asFile }) {
        into 'META-INF/folkways-updater'
        rename { 'helper.jar' }
    }
}
tasks.withType(JavaExec).configureEach { standardInput = System.in }
