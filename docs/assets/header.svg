<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Folkways Updater</title>
  <desc id="desc">A warm landscape and three connected stages: prepare, verify, launch.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#142c38"/><stop offset="1" stop-color="#234b54"/></linearGradient>
    <linearGradient id="hill" x2="1"><stop stop-color="#456b62"/><stop offset="1" stop-color="#68816b"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#sky)"/>
  <circle cx="1080" cy="70" r="34" fill="#f0ce8f" opacity=".9"/>
  <path d="M0 249 160 194 295 226 446 169 621 220 814 158 1000 216 1200 165V300H0Z" fill="url(#hill)" opacity=".5"/>
  <path d="M0 274 207 236 391 264 572 213 780 259 1000 217 1200 259V300H0Z" fill="#36584f"/>
  <g fill="none" stroke="#e4bd7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
