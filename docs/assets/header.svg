  <text x="77" y="158" font-family="system-ui,Segoe UI,sans-serif" font-size="23" fill="#d2dfd9">Ready before the next launch.</text>
  <g font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#f0dbc0">
    <text x="79" y="221">PREPARE</text><text x="247" y="221">VERIFY</text><text x="391" y="221">LAUNCH</text>
